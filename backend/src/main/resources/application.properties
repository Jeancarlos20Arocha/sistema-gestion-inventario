# ======================================================
# SGM Backend - Configuracion (MySQL)
# ======================================================
spring.application.name=sgm-backend
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# ---------- Datasource MySQL ----------
# Credenciales alineadas con docker-compose.yml (MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sgm_db?useSSL=false&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:sgm}
spring.datasource.password=${DB_PASSWORD:sgm_pass_2026}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# ---------- JPA / Hibernate ----------
# validate: exige que el esquema (db/schema.sql) coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ---------- Jackson (LocalDateTime ISO) ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------- JWT ----------
# Vida del token de acceso (ms) = 24h
app.jwt.secret=${SGM_JWT_SECRET:sgm-super-secreto-corporativo-2026-cuya-longitud-supera-32-bytes-para-hs256-1234567890}
app.jwt.expiration-ms=${SGM_JWT_EXPIRATION:86400000}
# Token de restablecimiento (1 uso, corto) = 10 min
app.jwt.reset-expiration-ms=${SGM_JWT_RESET_EXPIRATION:600000}

# ---------- Politica de bloqueo de cuenta ----------
app.security.max-failed-attempts=3
app.security.lock-minutes=15

# ---------- Seeders ----------
app.seed.admin-username=ADMIN
app.seed.admin-password=123456

# ---------- Logging ----------
logging.level.org.hibernate.SQL=INFO
logging.level.com.sgm.backend=DEBUG
